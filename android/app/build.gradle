plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Folder tujuan penyalinan aset web di dalam build dir modul (lihat copyWebAssets).
// Isinya harus menjadi assets/saku/... di dalam APK — sama dengan URL yang dimuat
// MainActivity (file:///android_asset/saku/index.html).
def webAssetsDir = layout.buildDirectory.dir('webassets').get().asFile

android {
    namespace 'com.saku.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saku.app'
        minSdk 26
        targetSdk 34
        // Naikkan versi setiap perbaikan supaya mudah dicek di HP:
        // Pengaturan → Aplikasi → Saku → versi (atau di dalam app: Pengaturan → Bubble Maskot)
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        // Kunci debug yang KONSISTEN antar build — supaya update APK bisa ditimpa
        // tanpa uninstall. HANYA untuk distribusi pribadi/debug; untuk Play Store
        // gunakan keystore privatmu sendiri dan JANGAN commit ke repo.
        saku {
            storeFile rootProject.file('signing/saku-debug.p12')
            storePassword 'saku-kucing-hitam-2026'
            keyAlias 'saku'
            keyPassword 'saku-kucing-hitam-2026'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            // APK debug tetap bisa langsung di-install, dan update selanjutnya
            // menimpa aplikasi lama (tanda tangan tetap sama antar build CI)
            signingConfig signingConfigs.saku
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // aset web (PWA Saku) disalin dari root repo saat build — satu sumber kebenaran.
            // Ditulis eksplisit (bukan `+=`) supaya hasil merge pasti masuk ke APK.
            assets.srcDirs = [file('src/main/assets'), webAssetsDir]
        }
    }
}

// Salin aplikasi web Saku (root repo) → aset Android, menjadi assets/saku/... di dalam APK.
// Sync (bukan Copy) supaya file aset lama yang sudah tidak ada ikut dibersihkan dan
// tidak menumpuk di APK.
tasks.register('copyWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'styles/**'
        include 'js/**'
        include 'icons/**'
    }
    into new File(webAssetsDir, 'saku')
}
preBuild.dependsOn 'copyWebAssets'

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
