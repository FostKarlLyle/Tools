plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.saku.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saku.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // Kunci debug yang KONSISTEN antar build — supaya update APK bisa ditimpa
        // tanpa uninstall. HANYA untuk distribusi pribadi/debug; untuk Play Store
        // gunakan keystore privatmu sendiri dan JANGAN commit ke repo.
        saku {
            storeFile rootProject.file('signing/saku-debug.p12')
            storePassword 'saku-kucing-hitam-2026'
            keyAlias 'saku'
            keyPassword 'saku-kucing-hitam-2026'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            // APK debug tetap bisa langsung di-install, dan update selanjutnya
            // menimpa aplikasi lama (tanda tangan tetap sama antar build CI)
            signingConfig signingConfigs.saku
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // aset web (PWA Saku) disalin dari root repo saat build — satu sumber kebenaran
            assets.srcDirs += files(layout.buildDirectory.dir('webassets'))
        }
    }
}

// Salin aplikasi web Saku (root repo) → aset Android
tasks.register('copyWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'styles/**'
        include 'js/**'
        include 'icons/**'
    }
    into layout.buildDirectory.dir('webassets')
}
preBuild.dependsOn 'copyWebAssets'

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
