name: Build Android APK

# Build APK Saku (pembungkus Android + bubble maskot) di cloud.
# Hasilnya bisa diunduh sebagai artifact "saku-apk" dari tab Actions.
on:
  push:
    branches:
      - arena/a4c77440-tools
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      # aset web ikut dipaket di dalam APK:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'js/**'
      - 'styles/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d /opt
          /opt/gradle-8.7/bin/gradle --version

      - name: Build APK debug
        run: /opt/gradle-8.7/bin/gradle -p android assembleDebug --stacktrace --no-daemon

      - name: Upload APK (artifact "saku-apk")
        uses: actions/upload-artifact@v4
        with:
          name: saku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
